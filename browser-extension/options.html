<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Strat Journal Auto-Capture — Settings</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #111; color: #eee; max-width: 480px; margin: 40px auto; padding: 0 20px; }
  h2 { margin-bottom: 4px; }
  .sub { color: #999; font-size: 13px; margin-bottom: 24px; }
  label { display: block; margin-top: 16px; margin-bottom: 4px; font-size: 14px; color: #ccc; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1c1c1c; color: #eee; font-size: 14px; }
  button { margin-top: 20px; padding: 10px 18px; border-radius: 8px; border: none; background: #4da3ff; color: #111; font-weight: 600; cursor: pointer; }
  .status { margin-top: 14px; font-size: 13px; color: #7fd88f; min-height: 18px; }
</style>
</head>
<body>
  <h2>Strat Journal Auto-Capture</h2>
  <div class="sub">Same Backend URL and App Key as the Journal app itself (Journal tab &rarr; Schwab Connection).</div>

  <label for="backendUrl">Backend URL</label>
  <input id="backendUrl" placeholder="https://strat-journal-backend.onrender.com">

  <label for="appKey">App Key</label>
  <input id="appKey" placeholder="same App Key as the Journal app">

  <button id="save">Save</button>
  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
