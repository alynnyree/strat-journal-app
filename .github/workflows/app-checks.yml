# Runs on every proposed change to the phone app, before it can go live.
#
# Until 30 Sept 2026 this project had NO automatic checks at all: a change
# reached his phone the moment it was merged, and every check was run by
# hand, when someone remembered. Blocker 1 of the audit ("freeze and protect
# the codebase"), authorized by the owner on 30 Sept 2026, option (a):
# required checks, with his written approval as the review.
#
# It uses the same browser checks that are run by hand, in a real browser.
# No trade data is involved: his exported journal is never in this public
# project, and the checks that need it say so and skip only those parts.
name: App checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every script in the app parses
        run: node tests/ci/syntax.js
      # The same version used when these checks are run by hand.
      - name: Install the browser the checks drive
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      # The FULL Chromium, not Playwright's default "headless shell". The
      # shell reports its language as "en-US@posix" on this machine, a tag
      # it then refuses when asked to format a time -- so the chart's time
      # labels threw and five chart checks failed on the first run here,
      # while passing by hand. An iPhone reports an ordinary tag ("en-US"),
      # which the full browser matches. Measured 30 Sept 2026, not assumed.
      - name: Use the full browser, the same one the checks are run with by hand
        run: echo "CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Run every check (fails on any failure not already on record)
        run: node tests/ci/run-all.js
